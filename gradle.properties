# Project-wide Gradle settings.
# For more information on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=true

# NOTE: Do not add machine-specific paths (like org.gradle.java.home) here.
# Gradle will automatically find Java from JAVA_HOME or Android Studio's bundled JDK.
# For local overrides, create a local.properties file or set environment variables.

# Increase memory allocation for Gradle build process
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable parallel builds and build cache
org.gradle.parallel=true
org.gradle.caching=true